<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">安装布局</title>
  <desc id="desc">仓库通过 make install 安装到 bin，发布包通过 install.sh 安装到 sbin；两者都安装库与许可文件。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#44546a"/>
    </marker>
  </defs>
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="50" y="52" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">安装布局</text>
  <text x="50" y="82" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#5b6573">两种安装方式的主程序位置不同，库与许可文件位置相同。</text>

  <rect x="50" y="120" width="260" height="100" rx="10" fill="#eef4fb" stroke="#1f4e79"/>
  <text x="180" y="148" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1f4e79">仓库</text>
  <text x="180" y="172" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#374151">bin/ lib/ agent/</text>
  <text x="180" y="194" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#5b6573">LICENSE · NOTICE · TRADEMARK</text>

  <rect x="380" y="140" width="200" height="60" rx="10" fill="#ffffff" stroke="#1f4e79"/>
  <text x="480" y="166" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1f4e79">make install</text>
  <text x="480" y="186" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#5b6573">PREFIX 默认 /usr/local</text>

  <rect x="660" y="110" width="390" height="130" rx="10" fill="#f0fdf4" stroke="#2e7d32"/>
  <text x="680" y="138" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#166534">安装结果</text>
  <text x="680" y="162" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#374151">$(PREFIX)/bin/migrator</text>
  <text x="680" y="184" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#374151">$(PREFIX)/bin/migrator-agent</text>
  <text x="680" y="206" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#374151">$(PREFIX)/lib/migrator/</text>
  <text x="680" y="228" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#374151">$(PREFIX)/share/doc/migrator/</text>

  <line x1="310" y1="170" x2="372" y2="170" stroke="#44546a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="580" y1="170" x2="652" y2="170" stroke="#44546a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="50" y="330" width="260" height="120" rx="10" fill="#fff7ed" stroke="#b45309"/>
  <text x="180" y="358" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e">发布包目录</text>
  <text x="180" y="382" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#374151">SHA256SUMS</text>
  <text x="180" y="404" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#374151">migrator-&lt;ver&gt;.tar.gz</text>
  <text x="180" y="426" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#5b6573">由部署方自行托管</text>

  <rect x="380" y="350" width="200" height="60" rx="10" fill="#ffffff" stroke="#b45309"/>
  <text x="480" y="376" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e">tools/install.sh</text>
  <text x="480" y="396" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#5b6573">校验 SHA-256 · 原子替换</text>

  <rect x="660" y="320" width="390" height="130" rx="10" fill="#f0fdf4" stroke="#2e7d32"/>
  <text x="680" y="348" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#166534">安装结果</text>
  <text x="680" y="372" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#374151">$PREFIX/sbin/migrator</text>
  <text x="680" y="394" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#374151">$PREFIX/sbin/migrator-agent</text>
  <text x="680" y="416" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#374151">$PREFIX/lib/migrator/</text>
  <text x="680" y="438" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#374151">$PREFIX/share/doc/migrator/</text>

  <line x1="310" y1="380" x2="372" y2="380" stroke="#44546a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="580" y1="380" x2="652" y2="380" stroke="#44546a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="50" y="500" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#5b6573">主程序查找库：先看源码树布局的 ../lib/common.sh，否则使用 /usr/local/lib/migrator。</text>
  <text x="50" y="524" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#5b6573">因此只有 /usr/local 前缀开箱即用；非默认 PREFIX 需要额外处理库路径。</text>
  <text x="50" y="548" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#5b6573">安装后检查：migrator -V 应报告版本；migrator -h 应列出全部选项。</text>
  <text x="50" y="572" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#5b6573">发布包必须携带 LICENSE、LICENSE-UPSTREAM、NOTICE 与 TRADEMARK.md。</text>
  <text x="50" y="596" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#b91c1c">非默认 PREFIX 下的库路径限制属于当前实现，不应在发布说明中描述为可直接使用。</text>
</svg>

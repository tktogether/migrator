<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">QEMU 试启动</title>
  <desc id="desc">目标磁盘作为只读后端，QEMU 使用 qcow2 叠加盘启动，通过串口断言到达多用户。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#44546a"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="50" y="52" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">QEMU 试启动</text>
  <text x="50" y="82" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#5b6573">验证全部通过后执行；目标磁盘不写入。</text>

  <rect x="40" y="110" width="280" height="100" rx="10" fill="#eef4fb" stroke="#1f4e79"/>
  <text x="180" y="138" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1f4e79">目标树（只读挂载）</text>
  <text x="180" y="162" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">计划中的默认启动项</text>
  <text x="180" y="184" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">复制 vmlinuz 与 initrd</text>

  <rect x="40" y="280" width="280" height="100" rx="10" fill="#fff7ed" stroke="#b45309"/>
  <text x="180" y="308" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e">目标磁盘</text>
  <text x="180" y="332" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">例如 /dev/sda</text>
  <text x="180" y="354" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">只读后端，不接收写入</text>

  <rect x="390" y="280" width="280" height="100" rx="10" fill="#dcfce7" stroke="#2e7d32"/>
  <text x="530" y="308" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#166534">qcow2 叠加盘</text>
  <text x="530" y="332" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">overlay.qcow2</text>
  <text x="530" y="354" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">虚拟机的写入落在这里</text>

  <rect x="760" y="100" width="300" height="280" rx="10" fill="#f5f3ff" stroke="#6d28d9"/>
  <text x="910" y="130" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#5b21b6">QEMU 虚拟机</text>
  <text x="910" y="156" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">直接内核引导（-kernel / -initrd）</text>
  <text x="910" y="180" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">-m 1024，-smp 1</text>
  <text x="910" y="204" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">-drive overlay.qcow2（virtio）</text>
  <text x="910" y="228" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">-serial file:serial.log</text>
  <text x="910" y="260" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">内核命令行追加 console=ttyS0</text>
  <text x="910" y="284" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">等待上限 600 秒</text>
  <text x="910" y="316" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">目标磁盘始终不写入</text>
  <text x="910" y="340" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">panic 或提前退出 = FAIL</text>

  <line x1="320" y1="160" x2="752" y2="160" stroke="#44546a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="536" y="148" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">vmlinuz / initrd</text>

  <line x1="320" y1="330" x2="382" y2="330" stroke="#44546a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="351" y="318" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#374151">只读后端</text>
  <line x1="670" y1="330" x2="752" y2="330" stroke="#44546a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="711" y="318" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#374151">virtio 磁盘</text>

  <rect x="760" y="420" width="300" height="70" rx="10" fill="#ffffff" stroke="#6d28d9"/>
  <text x="910" y="446" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="700" fill="#5b21b6">serial.log</text>
  <text x="910" y="468" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#374151">剥离 ANSI 色码后匹配目标名</text>
  <line x1="910" y1="380" x2="910" y2="412" stroke="#44546a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="40" y="420" width="680" height="100" rx="10" fill="#f0fdf4" stroke="#2e7d32"/>
  <text x="60" y="446" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="700" fill="#166534">判定</text>
  <text x="60" y="470" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#374151">PASS：出现 Reached target Basic/Multi-User 或 Startup finished。</text>
  <text x="60" y="492" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#374151">FAIL：panic、QEMU 提前退出或 600 秒超时。</text>
  <line x1="752" y1="470" x2="722" y2="470" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arrowGreen)"/>

  <text x="50" y="552" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">内存低于 3072 MiB 或可用内存低于 1536 MiB 时跳过并警告；slim Live 不含 QEMU，通常无法执行。</text>
  <text x="50" y="576" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">QEMU 缺失时可从镜像安装；-o offline=1 时只跳过，不安装。</text>
  <text x="50" y="600" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">试启动失败与 verify 失败同样阻止切换：目标盘已写入，应先修复再重试。</text>
</svg>

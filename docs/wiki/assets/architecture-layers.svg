<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">代码分层</title>
  <desc id="desc">命令行驱动、共享核心、迁移阶段、外部工具与运行状态的分层结构。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#44546a"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="50" y="52" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">代码分层</text>
  <text x="50" y="82" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#5b6573">驱动只负责调度；阶段库负责单一职责；外部命令通过 seam 隔离。</text>

  <rect x="50" y="110" width="1100" height="80" rx="12" fill="#eef4fb" stroke="#1f4e79"/>
  <text x="70" y="138" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#1f4e79">CLI 驱动</text>
  <text x="70" y="162" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#374151">bin/migrator</text>
  <text x="200" y="162" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">阶段调度 · tmux · 锁 · 身份打印 · 模式判定</text>

  <rect x="50" y="230" width="1100" height="110" rx="12" fill="#f5f7fa" stroke="#8aa4c8"/>
  <text x="70" y="258" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#1f4e79">共享核心</text>
  <rect x="70" y="275" width="340" height="50" rx="8" fill="#ffffff" stroke="#8aa4c8"/>
  <text x="240" y="296" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#1f2937">common.sh</text>
  <text x="240" y="315" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#5b6573">输出 · 选项 · 状态 · 退出码</text>
  <rect x="430" y="275" width="340" height="50" rx="8" fill="#ffffff" stroke="#8aa4c8"/>
  <text x="600" y="296" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#1f2937">ssh.sh</text>
  <text x="600" y="315" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#5b6573">控制通道 · 数据通道 · 中继</text>
  <rect x="790" y="275" width="340" height="50" rx="8" fill="#ffffff" stroke="#8aa4c8"/>
  <text x="960" y="296" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#1f2937">bootstrap.sh</text>
  <text x="960" y="315" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#5b6573">工具检查 · agent 分发 · 版本</text>

  <rect x="50" y="370" width="1100" height="150" rx="12" fill="#eef4fb" stroke="#b9cbe3"/>
  <text x="70" y="398" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#1f4e79">迁移阶段</text>
  <rect x="60" y="412" width="128" height="86" rx="8" fill="#ffffff" stroke="#1f4e79"/>
  <text x="124" y="438" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#1f2937">inventory</text>
  <text x="124" y="458" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#5b6573">只读清单</text>
  <rect x="196" y="412" width="128" height="86" rx="8" fill="#ffffff" stroke="#1f4e79"/>
  <text x="260" y="438" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#1f2937">plan</text>
  <text x="260" y="458" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#5b6573">纯函数规划</text>
  <rect x="332" y="412" width="128" height="86" rx="8" fill="#ffffff" stroke="#1f4e79"/>
  <text x="396" y="438" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#1f2937">apply</text>
  <text x="396" y="458" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#5b6573">擦盘 · 分区 · mkfs</text>
  <rect x="468" y="412" width="128" height="86" rx="8" fill="#ffffff" stroke="#1f4e79"/>
  <text x="532" y="438" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#1f2937">transfer</text>
  <text x="532" y="458" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#5b6573">块级 / 文件级</text>
  <rect x="604" y="412" width="128" height="86" rx="8" fill="#ffffff" stroke="#1f4e79"/>
  <text x="668" y="438" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#1f2937">target</text>
  <text x="668" y="458" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#5b6573">挂载 / chroot</text>
  <rect x="740" y="412" width="128" height="86" rx="8" fill="#ffffff" stroke="#1f4e79"/>
  <text x="804" y="438" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#1f2937">postfix</text>
  <text x="804" y="458" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#5b6573">配置修补</text>
  <rect x="876" y="412" width="128" height="86" rx="8" fill="#ffffff" stroke="#1f4e79"/>
  <text x="940" y="438" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#1f2937">netfix</text>
  <text x="940" y="458" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#5b6573">网卡名 / MAC</text>
  <rect x="1012" y="412" width="128" height="86" rx="8" fill="#ffffff" stroke="#1f4e79"/>
  <text x="1076" y="438" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#1f2937">verify</text>
  <text x="1076" y="458" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#5b6573">只读检查 / cutover</text>

  <rect x="50" y="550" width="1100" height="100" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="70" y="578" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2937">外部工具</text>
  <rect x="70" y="590" width="340" height="46" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="240" y="618" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#374151">ssh · partclone · tar · lz4 · zstd</text>
  <rect x="430" y="590" width="340" height="46" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="600" y="618" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#374151">migrator-agent（静态 C 二进制）</text>
  <rect x="790" y="590" width="340" height="46" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="960" y="618" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#374151">mkfs · fsck · GRUB · efibootmgr · dnf/apt</text>

  <rect x="50" y="680" width="1100" height="80" rx="12" fill="#fff7ed" stroke="#b45309"/>
  <text x="70" y="708" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#92400e">运行状态</text>
  <text x="70" y="734" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">/run/migrator：state · plan · log · failure · vol-N.log · online.out · verify.log · summary</text>
  <text x="620" y="734" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">内存文件系统；重启后丢失</text>

  <line x1="600" y1="190" x2="600" y2="222" stroke="#44546a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="600" y1="340" x2="600" y2="362" stroke="#44546a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="600" y1="520" x2="600" y2="542" stroke="#44546a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="600" y1="650" x2="600" y2="672" stroke="#44546a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="50" y="790" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">约定：后面的库可以调用前面的库；前面的库不得依赖后面的库。阶段之间通过 $RUN/state 传递进度，全局变量只用于本次运行的配置与路径。</text>
</svg>

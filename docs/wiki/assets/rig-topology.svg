<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">QEMU 实验台拓扑</title>
  <desc id="desc">构建机上运行 donor 与 recipient 两台虚拟机，共享 Live ISO，通过 hostfwd 暴露控制与数据端口，迁移后独立启动目标磁盘验收。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#44546a"/>
    </marker>
  </defs>
  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="50" y="52" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">QEMU 实验台拓扑</text>
  <text x="50" y="82" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#5b6573">两台虚拟机、一份 Live ISO、两个稀疏磁盘；TCG 可在无 KVM 的容器中运行。</text>

  <rect x="40" y="110" width="1120" height="430" rx="14" fill="#f8fafc" stroke="#9ca3af"/>
  <text x="60" y="140" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2937">构建机（Linux，root，qemu-system-x86_64）</text>

  <rect x="80" y="165" width="480" height="165" rx="12" fill="#fff7ed" stroke="#b45309"/>
  <text x="320" y="194" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">donor VM</text>
  <text x="320" y="218" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">Live ISO + donor-disk.raw（vda）</text>
  <text x="320" y="240" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">内存默认 512 MiB · 2 vCPU</text>
  <text x="320" y="262" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">hostfwd 2233 → 22（控制通道）</text>
  <text x="320" y="284" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">hostfwd 2222 → 2222（数据通道）</text>
  <text x="320" y="308" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">串口日志：logs/donor-serial.log</text>

  <rect x="640" y="165" width="480" height="165" rx="12" fill="#eef4fb" stroke="#1f4e79"/>
  <text x="880" y="194" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1f4e79">recipient VM</text>
  <text x="880" y="218" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">Live ISO + target-disk.raw（vda，20 GiB 稀疏）</text>
  <text x="880" y="240" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">内存默认 768 MiB · 2 vCPU</text>
  <text x="880" y="262" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">hostfwd 2255 → 22</text>
  <text x="880" y="284" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">迁移在 VM 内后台执行，退出码写入文件</text>
  <text x="880" y="308" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">串口日志：logs/recipient-serial.log</text>

  <line x1="640" y1="210" x2="568" y2="210" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="604" y="198" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#166534">10.0.2.2:2233</text>
  <line x1="640" y1="270" x2="568" y2="270" stroke="#44546a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="604" y="258" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#374151">10.0.2.2:2222</text>

  <rect x="80" y="360" width="480" height="150" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="100" y="388" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2937">工件与脚本</text>
  <text x="100" y="412" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">migrator-live.iso（含工具、agent、zram、静态网络）</text>
  <text x="100" y="434" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">rig_ed25519 / rig_ed25519.pub</text>
  <text x="100" y="456" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">donor-disk.raw（2 GiB，最小 Debian）</text>
  <text x="100" y="478" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">target-disk.raw（20 GiB 稀疏，运行时创建）</text>
  <text x="100" y="500" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">run-offline.sh · verify-target.sh · clean.sh</text>

  <rect x="640" y="360" width="480" height="150" rx="12" fill="#f0fdf4" stroke="#2e7d32"/>
  <text x="660" y="388" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#166534">独立验收</text>
  <text x="660" y="412" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">verify-target.sh 单独启动 target-disk.raw，</text>
  <text x="660" y="434" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">不再附加 Live ISO。</text>
  <text x="660" y="456" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">hostfwd 2266 → 22；等待 SSH。</text>
  <text x="660" y="478" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">断言 hostname、payload SHA-256、heartbeat 服务。</text>
  <text x="660" y="500" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">这是离线实验台的端到端验收门禁。</text>

  <line x1="560" y1="435" x2="632" y2="435" stroke="#44546a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="596" y="424" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#5b6573">target-disk.raw</text>
  <line x1="880" y1="330" x2="880" y2="352" stroke="#44546a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="50" y="580" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#5b6573">ACCEL=tcg（默认）或 kvm；DONOR_MEM / RECIP_MEM 可调整内存；宿主内存不足时 OOM killer 可能终止 QEMU。</text>
  <text x="50" y="604" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#5b6573">ISO 的 toram 会释放光盘介质；分区介质的自包含引导使用 toram=filesystem.squashfs，不能使用裸 toram。</text>
  <text x="50" y="628" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#5b6573">清理使用 rig/clean.sh：模式写在脚本内部，避免 pkill -f 的模式匹配到调用者自身。</text>
</svg>

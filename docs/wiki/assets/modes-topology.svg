<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">三种迁移拓扑</title>
  <desc id="desc">离线迁移两端均为 Live；在线迁移源端运行原系统；中继迁移通过第三台主机转发控制、数据与切换通道。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#44546a"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="50" y="52" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">三种迁移拓扑</text>
  <text x="50" y="82" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#5b6573">模式由源端状态决定；中继只改变连接路径，不改变复制逻辑。</text>

  <rect x="40" y="100" width="1120" height="180" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="60" y="134" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1f2937">离线迁移（off-line）</text>
  <text x="60" y="158" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#5b6573">源端与目标端都启动到迁移 Live；每卷复制一次，无冻结。</text>
  <rect x="100" y="180" width="280" height="70" rx="10" fill="#eef4fb" stroke="#1f4e79"/>
  <text x="240" y="206" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1f4e79">源端：迁移 Live</text>
  <text x="240" y="228" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">原磁盘不挂载；磁盘只读</text>
  <rect x="820" y="180" width="280" height="70" rx="10" fill="#eef4fb" stroke="#1f4e79"/>
  <text x="960" y="206" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1f4e79">目标端：迁移 Live</text>
  <text x="960" y="228" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">执行 migrator 与写入目标盘</text>
  <line x1="380" y1="215" x2="812" y2="215" stroke="#44546a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="600" y="202" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" fill="#374151">SSH 数据通道 :2222；或 data=raw / nc</text>
  <text x="600" y="236" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">停机时间 = 数据传输时间 + 切换与启动时间</text>

  <rect x="40" y="300" width="1120" height="180" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="60" y="334" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1f2937">在线迁移（on-line）</text>
  <text x="60" y="358" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#5b6573">源端继续运行原系统；agent 记录写入，多轮增量后冻结。</text>
  <rect x="100" y="380" width="280" height="70" rx="10" fill="#fff7ed" stroke="#b45309"/>
  <text x="240" y="406" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">源端：运行中的原系统</text>
  <text x="240" y="428" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">/run 临时 agent；磁盘只读</text>
  <rect x="820" y="380" width="280" height="70" rx="10" fill="#eef4fb" stroke="#1f4e79"/>
  <text x="960" y="406" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1f4e79">目标端：迁移 Live</text>
  <text x="960" y="428" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">pull、预检、postfix、verify</text>
  <line x1="380" y1="398" x2="812" y2="398" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="600" y="386" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" fill="#166534">多轮增量：migrator-agent pull</text>
  <line x1="812" y1="436" x2="380" y2="436" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="600" y="456" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" fill="#92400e">冻结后的切换轮询：源端主动连接目标端</text>

  <rect x="40" y="500" width="1120" height="250" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="60" y="534" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1f2937">中继迁移（relay）</text>
  <text x="60" y="558" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#5b6573">两端不能直接互访时，由第三台主机转发；固定端口 2222、2223、2224。</text>
  <rect x="60" y="580" width="240" height="80" rx="10" fill="#fff7ed" stroke="#b45309"/>
  <text x="180" y="606" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">源端（donor）</text>
  <text x="180" y="628" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">sshd :22 / 数据 sshd :2222</text>
  <rect x="480" y="570" width="240" height="100" rx="10" fill="#f5f3ff" stroke="#6d28d9"/>
  <text x="600" y="596" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#5b21b6">中继（relay）</text>
  <text x="600" y="618" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">2222 → donor:22</text>
  <text x="600" y="636" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">2223 → donor:2222</text>
  <text x="600" y="654" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">2224 → recipient:2224</text>
  <rect x="900" y="580" width="240" height="80" rx="10" fill="#eef4fb" stroke="#1f4e79"/>
  <text x="1020" y="606" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1f4e79">目标端（recipient）</text>
  <text x="1020" y="628" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">控制 / 数据 / 切换监听 :2224</text>
  <line x1="300" y1="612" x2="472" y2="612" stroke="#44546a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="386" y="600" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">relay-tunnel.sh -R</text>
  <line x1="720" y1="612" x2="892" y2="612" stroke="#44546a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="806" y="600" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#374151">DONOR=relay:2222</text>
  <line x1="892" y1="648" x2="720" y2="648" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="806" y="666" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#92400e">relay:2224 → recipient:2224</text>
  <text x="60" y="722" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#5b6573">中继要求：GatewayPorts clientspecified 或 yes；AllowTcpForwarding yes；同一公钥在 relay 的 authorized_keys 中。</text>
</svg>

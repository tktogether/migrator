title Rocky Linux (5.14.0-503.el9.x86_64) 9.5 (Blue Onyx)
version 5.14.0-503.el9.x86_64
linux /vmlinuz-5.14.0-503.el9.x86_64
initrd /initramfs-5.14.0-503.el9.x86_64.img $tuned_initrd
options root=/dev/mapper/rl-root ro resume=/dev/mapper/rl-swap rd.lvm.lv=rl/root rd.lvm.lv=rl/swap net.ifnames=0 biosdevname=0 $tuned_params
grub_users $grub_users
grub_arg --unrestricted
grub_class rocky
